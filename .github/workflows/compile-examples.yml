name: Compile Examples

on:
  push:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
    branches: 
      - main
      - examples
      - dev/*
      - actions
  pull_request:
    paths:
      - ".github/workflows/compile-examples.yml"
      - "examples/**"
      - "src/**"
    branches: 
      - main
      - staging
  schedule:
    # Run every Tuesday at 8 AM UTC to catch breakage caused by changes to external resources (stm32duino).
    - cron: "0 8 * * TUE"
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fqbn:
          - STMicroelectronics:stm32:GenF1:pnum=BLUEPILL_F103C8
          - STMicroelectronics:stm32:GenH7:pnum=GENERIC_H750VBTX
          - arduino:avr:uno
          - MiniCore:avr:328:variant=modelPB
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          verbose: false
          enable-warnings-report: true
          enable-deltas-report: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: STMicroelectronics:stm32
              source-url: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
            - name: MiniCore:avr
              source-url: https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json
            - name: arduino:avr
          cli-compile-flags: |
            - --warnings="default"

      - name: Transform fqbn with awk
        id: get_fqbn
        run: |
          fqbn=$(echo "${{ matrix.fqbn }}" | awk 'gsub(/:/, "_")')
          echo "fqbn=$fqbn" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: 'sketches-reports-${{ steps.get_fqbn.outputs.fqbn }}'
          path: sketches-reports


  generate-docs:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Generate Doxygen files
        uses: mattnotmitt/doxygen-action@edge
        with:
            working-directory: '.'
            doxyfile-path: './doxygen/doxygen.conf'

      - name: Deploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/actions'
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./doxygen/html