name: Notify on failed job

on:
  workflow_run: 
    workflows: ["Compile Examples"]
    types: completed
    branches: 
      - "*"
  repository_dispatch:

jobs:
  notify-on-failed:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Create directory for downloaded files
        run: |
          mkdir ./artifacts

      - name: Download artifacts from failed workflow
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
      
      - name: Download logs from failed workflow
        run: |
          curl -L -k \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs \
          -o ./artifacts/run_logs.zip


      - name: Get workflow jobs data
        id: get-jobs
        run: |
          curl \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "${{ github.event.workflow_run.jobs_url }}" \
          -o ./artifacts/jobs.txt
          # JOBS_DATA=$(cat ./artifacts/jobs.txt)
          # echo "jobs_data=$JOBS_DATA" >> "$GITHUB_OUTPUT"

      - name: Send Telegram message about failed job
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown 
          document: ./artifacts/**
          
          message: |
            ❌ Action *${{ github.event.workflow_run.name }}* in *${{ github.repository }}* on branch [${{ github.event.workflow_run.head_branch }}](https://github.com/${{ github.repository }}/tree/${{ github.event.workflow_run.head_branch }}) failed!

            [Last commit](https://github.com/${{ github.repository }}/commit/${{github.event.workflow_run.head_sha}}) by *${{ github.event.workflow_run.head_commit.committer.username }}* on ${{ github.event.workflow_run.head_commit.timestamp }}. 
            Details: ${{ github.event.workflow_run.head_commit.message }}

            Jobs: ${{ github.event.workflow_run.jobs_url }}

            [@Maintainer](tg://user?id=${{ secrets.TELEGRAM_MAINTAINER_ID }})

