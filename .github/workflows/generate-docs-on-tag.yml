name: Publish Doxygen documentation

on:
  push:
    tags: 
      - "v*"
  workflow_dispatch:
  repository_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: "gh-pages"
          path: ./pages

      - name: Create doc/ directory if not exists
        run: |
          mkdir -p ./pages/doc

      - name: Remove outdated directory listing from root
        run: |
          rm -f ./pages/doc/index.html

      - run: |
          echo "OUTPUT_DIRECTORY=./pages/doc/${{ github.ref_name }}" >> ./doxygen/doxygen.conf
          echo "PROJECT_NUMBER=${{ github.ref_name }}" >> ./doxygen/doxygen.conf  

      - name: Generate Doxygen files
        uses: mattnotmitt/doxygen-action@edge
        with:
          working-directory: '.'
          doxyfile-path: './doxygen/doxygen.conf'

      - name: Upload generated docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 'IntroSatLib-docs-${{github.ref_name}}'
          path: './pages/doc/${{ github.ref_name }}'
          

      - name: Generate Directory Listings
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: pages/doc # Directory to generate index for
      
      - name: Deploy Doxygen files to GH Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages/doc
          destination_dir: ./doc
